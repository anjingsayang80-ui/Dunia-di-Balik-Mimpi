ansform="translate(690 180) scale(0.55)"/><rect x="14" y="282" width="872" height="44" rx="11" fill="#fff9e9" opacity=".97"/><text x="30" y="311" fill="#29213d" font-family="system-ui,sans-serif" font-size="20" font-weight="750">Nara menyenandungkan lagu yang membuat Eira membuka mata.</text></g><g transform="translate(30 890)"><rect width="900" height="340" rx="20" fill="#1a2645" stroke="#f2d99a" stroke-width="5"/><rect x="260" y="20" width="390" height="240" rx="120" fill="url(#glass)" opacity=".4" stroke="#e9f7ff" stroke-width="8"/><use href="#eira" transform="translate(350 90) scale(0.75)"/><use href="#kuro" transform="translate(520 180) scale(0.62)"/><path d="M540 30L570 10L600 30L600 75L570 98L540 75Z" fill="none" stroke="#f6dda0" stroke-width="5"/><use href="#arka" transform="translate(80 100) scale(0.6)"/><use href="#rina" transform="translate(190 100) scale(0.6)"/><use href="#ren" transform="translate(700 100) scale(0.6)"/><rect x="14" y="282" width="872" height="44" rx="11" fill="#fff9e9" opacity=".97"/><text x="30" y="311" fill="#29213d" font-family="system-ui,sans-serif" font-size="20" font-weight="750">Pantulan Kairun muncul di kaca, berdiri di sisi Eira.</text></g><text x="480" y="1260" text-anchor="middle" fill="#e8d8a8" font-family="system-ui,sans-serif" font-size="17">Arka · Rina · Ren · Nara · Kairun</text></svg>