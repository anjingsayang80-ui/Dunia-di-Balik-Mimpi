"12" fill="#fff8e8" opacity=".96"/><text x="34" y="306" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#28203e">Makhluk itu mengaku hanya memenuhi permintaan Kairun untuk menghapus rasa sakit.</text></g><g transform="translate(30 885)"><rect width="900" height="340" rx="18" fill="#303052" stroke="#f4d995" stroke-width="5"/><path d="M0 240Q200 170 450 240T900 230V340H0Z" fill="#16162e"/><path d="M450 35L450 245" stroke="#f4d88a" stroke-width="6"/><path d="M420 85Q450 50 480 85Q450 120 420 85Z" fill="#fff0b6"/><use href="#arka" transform="translate(150 100) scale(0.9)"/><use href="#kuro" transform="translate(390 165) scale(0.85)"/><use href="#rina" transform="translate(620 100) scale(0.9)"/><rect x="14" y="275" width="872" height="48" rx="12" fill="#fff8e8" opacity=".96"/><text x="34" y="306" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#28203e">Kuro memilih menghadapi kesalahannya, bukan bersembunyi darinya.</text></g><text x="480" y="1260" text-anchor="middle" fill="#e8d8a8" font-family="system-ui,sans-serif" font-size="17">Arka · Rina · Ren · Kairun</text></svg>