name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-game/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Export Godot Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

      - name: Set up Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Verify project and tools
        run: |
          test -f android-game/project.godot
          test -f android-game/export_presets.cfg
          godot --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot Android export paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project resources
        run: godot --headless --editor --path android-game --quit

      - name: Run game startup smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path android-game --quit-after 5 2>&1 | tee /tmp/godot-runtime-smoke.log
          if grep -Eq "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-runtime-smoke.log; then
            echo "Godot runtime startup reported a script error."
            exit 1
          fi

      - name: Export debug APK
        working-directory: android-game
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/DuniaDiBalikMimpi-debug.apk
          test -s build/DuniaDiBalikMimpi-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuniaDiBalikMimpi-Android-debug
          path: android-game/build/DuniaDiBalikMimpi-debug.apk
          if-no-files-found: error
          retention-days: 14
