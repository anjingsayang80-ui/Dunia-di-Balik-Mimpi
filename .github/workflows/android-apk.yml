name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-game/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Export Godot Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Godot project and Android preset
        run: |
          test -f android-game/project.godot
          test -f android-game/export_presets.cfg
          godot --version

      - name: Import project resources
        run: godot --headless --editor --path android-game --quit

      - name: Export debug APK
        run: |
          mkdir -p android-game/build
          godot --headless --path android-game --export-debug "Android" android-game/build/DuniaDiBalikMimpi-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuniaDiBalikMimpi-Android-debug
          path: android-game/build/DuniaDiBalikMimpi-debug.apk
          if-no-files-found: error
          retention-days: 14
